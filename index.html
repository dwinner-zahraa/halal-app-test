<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#e06666">
  <title>Halal App</title>
  <link rel="stylesheet" href="style.css?v=3">
</head>
<body>

  <!-- Top Bar -->
  <header class="app-header">
    <div><strong>LOGO</strong></div>
    <div id="time-display">--:--<br><small>-- ---</small></div>
    <div>🇲🇾 Flag</div>
  </header>

  <!-- Banner Slider -->
  <div class="banner-carousel">
    <p>Banner Slide (Updates / Info)</p>
  </div>

  <!-- Middle Section: Map & Saved -->
  <div class="middle-grid">
    <div class="active-map">Active Map</div>
    <div class="saved-history">Saved / History</div>
  </div>

  <!-- Bottom Slider -->
  <div class="bottom-carousel">
    <p>Halal Food & Snacks Slide</p>
  </div>

  <!-- Fixed Navigation Bar -->
  <nav class="bottom-nav">
    <button class="nav-item">Application</button>
    <button class="nav-item">Add Product</button>
    <button class="scan-btn">SCAN</button>
    <button class="nav-item">Countries</button>
    <button class="nav-item">Settings</button>
  </nav>

  <script>
    // Force unregister all old service workers to clear cached layouts
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function(registrations) {
        for (let registration of registrations) {
          registration.unregister();
        }
      });
    }

    // Live Clock Function
    function updateClock() {
      const now = new Date();

      // Format Time (e.g., 12:00 PM) based on user's timezone
      const timeOptions = { hour: '2-digit', minute: '2-digit', hour12: true };
      const timeString = now.toLocaleTimeString([], timeOptions);

      // Format Date (e.g., 26 AUG)
      const day = now.getDate();
      const monthOptions = { month: 'short' };
      const monthString = now.toLocaleDateString([], monthOptions).toUpperCase();

      // Update HTML content
      const timeDisplay = document.getElementById('time-display');
      if (timeDisplay) {
        timeDisplay.innerHTML = `${timeString}<br><small>${day} ${monthString}</small>`;
      }
    }

    // Run immediately on page load
    updateClock();

    // Update every second automatically
    setInterval(updateClock, 1000);
  </script>
</body>
</html>
